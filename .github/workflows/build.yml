name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          # every build gets a higher version number so it installs as an update
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build.log

      - name: Report build errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error|Error|What went wrong|Could not|FAILED|> " build.log | grep -v "^> Task" | head -80; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md

      - uses: actions/upload-artifact@v4
        with:
          name: Hammel-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to the fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/release/*.apk AliFiles.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AliFiles.apk --title "حمّل $VERSION (بناء ${{ github.run_number }})" --notes "$(git log -1 --pretty=%s)" --latest
