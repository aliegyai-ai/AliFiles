name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # QuickJS: the JavaScript engine yt-dlp needs for YouTube. Built for Android here and shipped
      # inside the APK as libqjs.so (Android only allows running programs that come as native libraries).
      # fresh ad-blocking lists inside the APK, so the blocker is strong from the first launch
      - name: Download ad-blocking lists
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/filters
          cd app/src/main/assets/filters
          curl -fsSL -o easylist.txt https://easylist.to/easylist/easylist.txt || true
          curl -fsSL -o easyprivacy.txt https://easylist.to/easylist/easyprivacy.txt || true
          curl -fsSL -o liste_ar.txt https://easylist-downloads.adblockplus.org/Liste_AR.txt || true
          curl -fsSL -o cookies.txt https://secure.fanboy.co.nz/fanboy-cookiemonster.txt || true
          curl -fsSL -o pgl.txt "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext" || true
          ls -la
      - name: Build QuickJS for Android
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs /tmp/qjs
          cmake -S /tmp/qjs -B /tmp/qjs/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          cmake --build /tmp/qjs/build --target qjs_exe -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/qjs/build/qjs app/src/main/jniLibs/arm64-v8a/libqjs.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          file app/src/main/jniLibs/arm64-v8a/libqjs.so; ls -la app/src/main/jniLibs/arm64-v8a/
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -PbuildNumber=$((100 + ${{ github.run_number }})) --stacktrace 2>&1 | tee build.log
          # every native engine must be inside the APK
          unzip -l app/build/outputs/apk/release/*.apk | grep "\.so$" | tee -a build.log
          for lib in libonnxruntime.so libqjs.so; do
            unzip -l app/build/outputs/apk/release/*.apk | grep -q "$lib" || { echo "error: $lib is missing from the APK" | tee -a build.log; exit 1; }
          done
      - name: Report build errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|What went wrong|Could not|FAILED|> " build.log | grep -v "^> Task" | head -80; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md
      - uses: actions/upload-artifact@v4
        with:
          name: AliFiles-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish to the fixed download link
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          VERSION="$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts).$CODE"
          cp app/build/outputs/apk/release/*.apk AliFiles.apk
          # version.json is what the app reads to know an update is available
          # notes = every change since the last published version (not just the last commit)
          PREV="$(curl -sfL "https://github.com/${{ github.repository }}/releases/download/latest/version.json" | jq -r '.sha // empty' || true)"
          if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then RANGE="$PREV..HEAD"; else RANGE="-1"; fi
          NOTES="$(git log $RANGE --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):|^CI|^ci:' | sed '/^$/d' | head -40)"
          [ -z "$NOTES" ] && NOTES="$(git log -1 --pretty=%s)"
          jq -n --argjson code "$CODE" --arg name "$VERSION" --arg notes "$NOTES" --arg sha "${{ github.sha }}" \
            '{versionCode: $code, versionName: $name, notes: $notes, sha: $sha}' > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          sleep 8   # GitHub needs a moment after deleting the tag, or the new release gets stuck as a draft
          for i in 1 2 3; do
            gh release create latest AliFiles.apk version.json --title "ملفات علي $VERSION" --notes "$NOTES" --latest --target "${{ github.sha }}" && break
            sleep 10
          done
          # make sure it's really published (the app's update link depends on it)
          sleep 5
          if [ "$(gh release view latest --json isDraft -q .isDraft)" != "false" ]; then
            gh release edit latest --draft=false --latest
          fi
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/latest/version.json"
      - name: Send APK to Telegram
        if: success() && env.TG_TOKEN != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          MSG=$(git log -1 --pretty=%s)
          cp "$APK" "AliFiles-$VERSION.apk"
          SIZE=$(stat -c %s "AliFiles-$VERSION.apk")
          if [ "$SIZE" -lt 49000000 ]; then
            curl -sS -F chat_id="$TG_CHAT" -F document=@"AliFiles-$VERSION.apk" \
              -F caption="📦 ملفات علي — نسخة $VERSION
          $MSG
          دوس على الملف عشان تثبّته" \
              "https://api.telegram.org/bot$TG_TOKEN/sendDocument" | head -c 300
          else
            curl -sS -d chat_id="$TG_CHAT" \
              --data-urlencode text="📦 نسخة $VERSION جاهزة بس حجمها أكبر من حد تيليجرام. نزّلها من: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://api.telegram.org/bot$TG_TOKEN/sendMessage" | head -c 300
          fi
      - name: Tell Telegram the build failed
        if: failure() && env.TG_TOKEN != ''
        run: |
          curl -sS -d chat_id="$TG_CHAT" --data-urlencode text="⚠️ بناء نسخة جديدة من ملفات علي فشل — Claude هيصلّحه." \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" | head -c 300
